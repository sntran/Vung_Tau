name: Geodata

# Downloads the OpenStreetMap data, the Copernicus DEM, the ground textures,
# and the EOT20 tide model, computes the tide (tide.py), builds
# data/geo/build/, and commits the changed files (plan 0005, D1, D12, and R8).
# Run this workflow by hand on main. The commit goes to the branch that the
# workflow runs on.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: geodata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  geodata:
    name: Fetch and build the geodata
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/geo/requirements.txt

      - name: Install osmium-tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osmium-tool

      - name: Install the Python packages
        run: pip install -r tools/geo/requirements.txt

      - name: Download the source data
        run: python tools/geo/fetch.py

      - name: Cache the EOT20 tide model
        uses: actions/cache@v4
        with:
          path: build/eot
          key: eot20-ocean-tides-v1

      - name: Compute the tide
        run: python tools/geo/tide.py --eot build/eot

      - name: Build the game data
        run: python tools/geo/build.py

      - name: Run the Python tests
        run: python -m pytest -q tools/geo/tests

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geodata-report
          path: |
            data/geo/build/report.md
            data/geo/build/tide_report.md
            data/geo/build/homestay_area.png
            data/geo/build/anchors.png
            data/geo/raw/manifest.json
          if-no-files-found: warn

      - name: Commit the changed files
        run: |
          git add data/geo assets/textures/ground
          if git diff --cached --quiet; then
            echo "The geodata did not change."
            exit 0
          fi
          git -c user.name="Sơn Trần-Nguyễn" -c user.email=github@sntran.com -c commit.gpgsign=false \
            commit -m "Update the geodata"
          git push origin "HEAD:${GITHUB_REF_NAME}"
