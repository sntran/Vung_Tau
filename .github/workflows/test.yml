name: Test

on:
  push:
  pull_request:

jobs:
  python:
    name: Voice build tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/voices/requirements-test.txt

      - name: Install the Python packages
        run: pip install -r tools/voices/requirements-test.txt

      - name: Run the Python tests
        run: python -m pytest -q tools/voices/tests

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: .tools
          key: godot-${{ runner.os }}-${{ hashFiles('tools/setup.sh') }}

      - name: Set up the tools
        run: tools/setup.sh

      - name: Unit tests
        run: tools/test.sh

  playtest:
    name: Play tests (part ${{ matrix.shard }} of 6)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - name: Install Xvfb and the Mesa OpenGL and Vulkan drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth mesa-utils \
            libgl1 libgl1-mesa-dri libglx-mesa0 libegl1 mesa-vulkan-drivers libvulkan1 \
            libxcursor1 libxinerama1 libxrandr2 libxi6 libfontconfig1

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: .tools
          key: godot-${{ runner.os }}-${{ hashFiles('tools/setup.sh') }}

      - name: Set up the tools
        run: tools/setup.sh

      - name: Play tests
        run: tools/playtest.sh --all --shard=${{ matrix.shard }}/6

      - name: Upload the play-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtest-${{ matrix.shard }}
          path: build/playtest/
          if-no-files-found: warn
