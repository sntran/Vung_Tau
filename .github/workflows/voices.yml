name: Voices

# Makes the voice audio of each spoken line with VieNeu-TTS on the CPU, and
# the audition page (plan 0003, R5 to R9). It commits the changed files to the
# branch that it runs on, then starts the export workflow, which publishes the
# audition page on GitHub Pages at /voices/.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/dialogue/**", "data/voices.json"]

permissions:
  contents: write
  actions: write

concurrency:
  group: voices-${{ github.ref }}
  cancel-in-progress: false

jobs:
  voices:
    name: Make the voices
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/voices/requirements.txt

      - name: Cache the model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: vieneu-${{ hashFiles('tools/voices/requirements.txt') }}

      - name: Install the Python packages
        run: pip install -r tools/voices/requirements.txt

      - name: Make the voice files and the audition page
        run: python tools/voices/build.py --audition docs/voices

      - name: Run the Python tests
        run: python -m pytest -q tools/voices/tests

      - name: Commit the changed files
        id: commit
        run: |
          git add assets/voices docs/voices
          if git diff --cached --quiet; then
            echo "The voices did not change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name="Sơn Trần-Nguyễn" -c user.email=github@sntran.com -c commit.gpgsign=false \
            commit -m "Update the voices"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push with the workflow token does not start other workflows. A
      # workflow_dispatch event does.
      - name: Publish the audition page
        if: steps.commit.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run export.yml --ref main
